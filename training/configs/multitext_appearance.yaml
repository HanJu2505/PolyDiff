# Configuration for training with pre-extracted cubemaps + appearance-only conditioning
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

name: "polydiff-multitext-appearance"

training:
  seed: 42
  epochs: 4
  batch_size: 32
  per_gpu_batch_size: 2
  learning_rate: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  warmup_steps: 100
  num_workers: 4
  num_gpus: 1
  use_checkpointing: true
  mixed_precision: "fp16"
  checkpoint_interval_type: "steps"
  checkpoint_interval: 100
  validation_interval: 10
  prediction_type: "epsilon"
  type: "multitext"
  resume_checkpoint: false
  resume_checkpoint_filename: ""
  max_train_steps: 0
  use_preextracted: true
  validation_sample_index: 1
  augment: true
  cubediff_weights: "/home/dell/code/PolyDiff/models/cubediff-512-multitxt/unet/diffusion_pytorch_model.safetensors"

model:
  id: "runwayml/stable-diffusion-v1-5"
  image_size: 512

directories:
  checkpoint_dir: "./checkpoints/polydiff-multitext-appearance"
  cache_dir: "~/.cache/huggingface/hub"
  cubemap_dir: "/home/dell/Datasets/PolyDiff/TrainCubeMaps"
  prompt_dir: "/home/dell/Datasets/PolyDiff/TrainPrompts"
  data_dir: "/home/dell/Datasets/PolyDiff/TrainERP"

swanlab:
  enabled: true
  project_name: "polydiff-training"
  use_cloud: true

appearance:
  clip_model_id: "openai/clip-vit-large-patch14"
  local_files_only: false
  beta: 0.6
  style_dim: 768
  style_gain_init: 4.0
  style_gain_max: 8.0
  style_block: "up_blocks.1"
  validation_time_scale: 0.5
  compare_time_scales: [0.5, 0.3]
  face_scales:
    front: 0.90
    left: 0.40
    right: 0.40
    back: 0.10
    top: 0.05
    bottom: 0.05
  time_schedule:
    split: 0.25
    early: 0.2
    late: 0.5
  cond_dropout:
    full_cond: 0.75
    text_only: 0.15
    null_cond: 0.10
  content_prompt_filter:
    enabled: true
    words:
      - "sunny"
      - "cloudy"
      - "golden hour"
      - "dramatic lighting"
      - "moody"
      - "cinematic"
      - "realistic"
      - "photorealistic"
      - "vivid"
      - "warm light"
  loss:
    weight: 0.05
    lambda_color: 0.8
    lambda_luma: 0.3
    face_weights:
      left: 0.35
      right: 0.35
      back: 0.08
      top: 0.05
      bottom: 0.05
